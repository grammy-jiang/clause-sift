name: Documentation / design change
description: Propose a documentation, architecture, specification, or design change with enough detail for an AI agent or maintainer to execute reliably.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        ## Purpose and quality bar

        Use this form for documentation and design work, including architecture, data models, retrieval behavior, build/runtime contracts, MCP/API/CLI contracts, evaluation design, security boundaries, contributor guidance, and other normative project documentation.

        The issue must be **self-contained and execution-ready at the documentation level**. A maintainer or AI agent should be able to act on it without private conversation history.

        Required quality rules:

        - Describe the current state before proposing the target state.
        - Ground factual claims in repository files, current behavior, specifications, or clearly identified external references.
        - Separate facts, proposals, assumptions, and open questions.
        - State scope and non-goals explicitly.
        - Preserve ClauseSift's established design principles unless this issue explicitly proposes and justifies changing one.
        - Define semantics, invariants, failure behavior, and edge cases where relevant.
        - Make acceptance criteria objective and reviewable.
        - Identify implementation work explicitly; do not hide implementation changes inside a documentation task.
        - Do not rely on phrases such as "as discussed", "as above", or "from the previous conversation".
        - Do not adopt a dependency, framework, database, or subsystem merely because a reference project uses it.

  - type: dropdown
    id: change_type
    attributes:
      label: Documentation change type
      description: Select the primary kind of documentation or design work.
      options:
        - Architecture / system design
        - Canonical data model / schema
        - Retrieval / ranking / context behavior
        - Build / ingestion / release pipeline
        - Runtime behavior
        - MCP / CLI / Python API contract
        - Evaluation / quality requirements
        - Security / safety / trust boundary
        - User / operator documentation
        - Contributor / development documentation
        - Terminology / glossary / ontology
        - Other
    validations:
      required: true

  - type: dropdown
    id: work_boundary
    attributes:
      label: Intended work boundary
      description: Clarify the expected boundary between documentation, investigation, and implementation.
      options:
        - Documentation only
        - Documentation now; implementation tracked separately
        - Documentation plus implementation in the same issue
        - Investigation / decision record only
    validations:
      required: true

  - type: textarea
    id: context_problem
    attributes:
      label: Context, current state, and problem
      description: Establish the repository-grounded baseline and explain the concrete problem before proposing a solution.
      placeholder: |
        ## Summary
        In 3-6 sentences:
        - What should change?
        - Why is the change needed?
        - What outcome should the documentation/design establish?
        - What important boundary should remain unchanged?

        ## Problem and motivation
        Explain:
        - the ambiguity, inconsistency, missing concept, incorrect assumption, or operational problem;
        - why it matters to ClauseSift;
        - user/developer/system impact;
        - why the current design is insufficient;
        - why this should be addressed now;
        - concrete examples where useful.

        ## Current repository state
        Cite exact repository evidence where possible:
        - `docs/design.md`, section "...": ...
        - `README.md`: ...
        - relevant code, schema, tests, examples, issues, or PRs: ...

        ## Gap analysis
        Identify:
        - contradictions;
        - unspecified behavior;
        - duplicated concepts;
        - terminology drift;
        - missing constraints;
        - assumptions that are currently implicit.

        Distinguish observed facts from hypotheses. Do not describe the proposed target state as though it already exists.
    validations:
      required: true

  - type: textarea
    id: proposal_semantics
    attributes:
      label: Proposed design, semantics, invariants, and edge cases
      description: Define the target state precisely enough that another agent can draft the documentation without inventing architecture or semantics.
      placeholder: |
        ## Proposed change
        Specify, as applicable:
        - concepts or terminology to introduce, rename, remove, or clarify;
        - architectural responsibilities and boundaries;
        - data structures, node/relationship types, states, lifecycle rules, or contracts;
        - required diagrams, tables, examples, or decision records;
        - API/MCP/CLI semantics;
        - normative requirements versus explanatory guidance;
        - how the new material relates to existing sections.

        Prefer statements such as "Define X as ..." and "Document that Y must ..." rather than "improve the docs".

        ## Semantics and invariants
        Define rules that must remain true, including where relevant:
        - authoritative source versus derived representation;
        - identity and versioning;
        - allowed source/target types;
        - relationship directionality/cardinality;
        - deterministic versus generated metadata;
        - immutable versus mutable state;
        - compatibility expectations;
        - runtime/build separation;
        - failure and warning behavior.

        ## Edge cases
        Cover relevant cases such as:
        - missing or empty data;
        - unresolved references;
        - low-confidence extraction;
        - malformed input;
        - ambiguous applicability;
        - superseded/amended documents;
        - conflicting evidence;
        - duplicate or cyclic relationships;
        - unsupported versions or document types.

        If the change is purely editorial and introduces no semantics, state that explicitly and explain why.
    validations:
      required: true

  - type: textarea
    id: scope_principles
    attributes:
      label: Scope, non-goals, and design-principle impact
      description: Bound the work tightly and show how it interacts with ClauseSift's established architecture.
      placeholder: |
        ## In scope
        Provide a finite, reviewable list:
        - Add/revise ...
        - Define ...
        - Reconcile ...
        - Add examples/diagrams for ...
        - Update cross-references in ...

        ## Non-goals / explicitly out of scope
        State project-specific exclusions. Examples:
        - No new runtime dependency.
        - No migration to a graph database.
        - No implementation in this issue.
        - No redesign of unrelated retrieval components.
        - No public API compatibility change.
        - No general-purpose agent memory or workflow subsystem.

        ## Impact on ClauseSift design principles
        Address every item as "unchanged", "strengthened", or "changed", with a short rationale:
        1. Accuracy before speed.
        2. Original documents remain authoritative.
        3. Offline compilation, read-only runtime.
        4. Deterministic rules before LLM inference.
        5. Immutable knowledge-base releases.
        6. Replaceable components behind stable interfaces.
        7. Fail visibly on uncertainty, conflict, or incomplete evidence.

        Any intentional change to a principle must be explicitly justified and documented as an architectural decision.
    validations:
      required: true

  - type: textarea
    id: impact_dependencies
    attributes:
      label: Affected artifacts, implementation implications, dependencies, and sequencing
      description: Identify where the change lands and what work it implies before and after this issue.
      placeholder: |
        ## Affected documentation and artifacts
        Expected edits:
        - `docs/design.md` — sections ...
        - `docs/...` — ...
        - `README.md` — ...

        Consistency checks:
        - Mermaid diagrams;
        - examples;
        - terminology/glossary;
        - canonical model/schema;
        - MCP/API/CLI documentation;
        - evaluation documentation;
        - changelog/ADR, if applicable.

        If exact files are not yet known, explain how they will be identified.

        ## Implementation implications
        State one clearly:
        - No implementation change is implied, because ...
        - Implementation is expected later; likely affected areas are ...
        - Implementation is included here; exact implementation scope is ...

        Include expected schema, migration, compatibility, test, packaging, or runtime implications.

        ## Dependencies and sequencing
        Prerequisites:
        - #...

        Related:
        - #...

        Follow-up:
        - #... / implementation issue for ...
        - evaluation issue for ...

        If none, state "None" and explain why this issue stands alone.
    validations:
      required: true

  - type: textarea
    id: decision_record
    attributes:
      label: Alternatives, risks, assumptions, open questions, and references
      description: Preserve the reasoning behind the proposed direction and prevent future agents from silently reopening or inventing design decisions.
      placeholder: |
        ## Alternatives considered
        For each serious alternative, include:
        - alternative;
        - benefits;
        - drawbacks;
        - reason accepted/rejected.

        Include "keep the current design" when meaningful.

        ## Risks and failure modes
        Consider:
        - accuracy/citation regressions;
        - loss of determinism;
        - hidden runtime complexity;
        - new heavy dependencies;
        - inconsistent terminology;
        - compatibility/migration ambiguity;
        - over-generalization beyond engineering evidence retrieval;
        - different agents implementing the design differently.

        For each material risk, provide a mitigation.

        ## Assumptions
        - ...

        ## Open questions requiring a decision
        - ...

        ## Questions intentionally deferred
        - ...

        An AI agent must not silently invent answers to material open questions.

        ## References and supporting evidence
        Repository:
        - `docs/...`, section ...
        - #issue / #PR ...

        External:
        - specification/project/paper URL — explain the exact idea or evidence being referenced.

        Explain why every external reference matters. A reference implementation is evidence or inspiration, not automatically a ClauseSift requirement.
    validations:
      required: true

  - type: textarea
    id: acceptance_validation
    attributes:
      label: Acceptance criteria and validation plan
      description: Define observable completion criteria and the checks that prove the resulting documentation is correct and internally consistent.
      placeholder: |
        ## Acceptance criteria
        Use objective checkboxes. Example:

        - [ ] `docs/design.md` contains a normative definition of ...
        - [ ] The relationship between X and Y is documented, including ...
        - [ ] Scope and non-goals explicitly state ...
        - [ ] At least one Mermaid diagram shows ...
        - [ ] Examples cover normal and edge-case behavior for ...
        - [ ] Existing contradictory terminology in ... is reconciled.
        - [ ] All affected internal links and cross-references are updated.
        - [ ] Implementation implications are explicitly included, excluded, or tracked separately.
        - [ ] No criterion depends on undocumented conversation context.

        Avoid subjective criteria such as "documentation is clear" unless paired with concrete evidence.

        ## Validation and review plan
        Include relevant checks:
        - compare final text against all seven design principles;
        - verify terminology across affected documents;
        - validate Mermaid syntax;
        - run Markdown lint / pre-commit checks;
        - verify links and section references;
        - compare examples against the documented model/API;
        - review for accidental scope expansion;
        - confirm implementation claims match the repository;
        - confirm any external claim against its authoritative source.
    validations:
      required: true

  - type: checkboxes
    id: quality_gate
    attributes:
      label: AI-agent / author submission quality gate
      description: Every item is mandatory. The issue should be a durable engineering artifact, not a reminder or conversation transcript.
      options:
        - label: I checked the repository and existing issues/PRs for duplicate, conflicting, or already-settled work and referenced related items where relevant.
          required: true
        - label: I inspected the current relevant documentation/code and described the actual repository state rather than assuming it.
          required: true
        - label: The issue is self-contained and does not depend on private chat history or unstated context.
          required: true
        - label: Facts, proposals, assumptions, and open questions are clearly distinguishable.
          required: true
        - label: Scope and non-goals are explicit enough to prevent an implementation agent from expanding the task into adjacent features.
          required: true
        - label: The proposal preserves ClauseSift's established design principles unless a change is explicitly justified.
          required: true
        - label: Semantics, invariants, failure behavior, and edge cases are specified wherever they affect implementation or interpretation.
          required: true
        - label: Acceptance criteria are objective and specific enough for another maintainer or AI agent to determine completion.
          required: true
        - label: Any implementation work implied by the documentation change is explicitly included, excluded, or identified as follow-up work.
          required: true
        - label: References are relevant and their significance is explained; external-project features are not presented as ClauseSift requirements without independent justification.
          required: true
        - label: The issue does not introduce a dependency, platform, database, framework, or architectural subsystem merely because a reference project uses one.
          required: true
